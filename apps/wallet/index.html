<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      The Wallet is watch-only: it holds NO private keys. connect-src allows
      http(s) so the user can point it at their own Esplora/electrs instance
      (including plain-http nodes on a LAN). No other origins are ever used;
      no telemetry exists in the codebase.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src https: http:; worker-src 'none'; child-src 'none'; frame-src 'none'; manifest-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="theme-color" content="#0d0b08" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Satoshi Vault — Wallet</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
