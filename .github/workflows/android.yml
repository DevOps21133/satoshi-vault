name: Android APKs

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - ".github/workflows/android.yml"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install (locked)
        run: npm ci

      - name: Test core
        run: npm run test -w @satoshivault/core

      - name: Build web bundles
        run: |
          npx vite build apps/signer
          npx vite build apps/wallet

      - name: Sync Capacitor projects
        run: |
          (cd apps/signer && npx cap sync android)
          (cd apps/wallet && npx cap sync android)

      - name: Build Signer APK
        run: cd apps/signer/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Build Wallet APK
        run: cd apps/wallet/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          cp apps/signer/android/app/build/outputs/apk/debug/app-debug.apk out/satoshi-vault-signer.apk
          cp apps/wallet/android/app/build/outputs/apk/debug/app-debug.apk out/satoshi-vault-wallet.apk
          sha256sum out/*.apk | sed 's| out/| |' > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      # The APKs also live in the repository itself (apk/), so anyone browsing
      # the project sees the installable builds without hunting for a release.
      - name: Commit APKs into the repository
        run: |
          mkdir -p apk
          cp out/satoshi-vault-signer.apk out/satoshi-vault-wallet.apk out/SHA256SUMS.txt apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/
          if git diff --cached --quiet; then
            echo "APKs unchanged — nothing to commit"
          else
            git commit -m "build: refresh APKs in apk/ from ${GITHUB_SHA::7} [skip ci]"
            # main may have moved while gradle ran — rebase this single commit on top.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: satoshi-vault-apks
          path: out/

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk-latest \
            --title "Satoshi Vault APKs (latest main)" \
            --notes "Debug-signed test builds of the Signer and Wallet apps, rebuilt on every push to main. Install: enable 'install unknown apps', download, open. The Signer APK requests NO internet permission — Android itself enforces the air gap. These builds are for testing; uninstall the previous build before installing a new one (debug signatures differ between CI runs)." \
            --prerelease || true
          gh release upload apk-latest out/satoshi-vault-signer.apk out/satoshi-vault-wallet.apk out/SHA256SUMS.txt --clobber
